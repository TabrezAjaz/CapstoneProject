name: Container vulnerability gate

on:
  push:
    branches: [main, sprint-2, sprint-3]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      image:
        description: Container image to scan
        required: true
        default: hello-world:latest
      fail_on:
        description: Minimum blocking severity
        required: true
        default: HIGH
        type: choice
        options: [LOW, MEDIUM, HIGH, CRITICAL]
  workflow_call:
    inputs:
      image:
        description: Container image to scan
        required: true
        type: string
      fail_on:
        description: Minimum blocking severity
        required: false
        default: HIGH
        type: string

permissions:
  contents: read

concurrency:
  group: container-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIVY_VERSION: v0.74.0
  SCAN_IMAGE: ${{ inputs.image || vars.SCAN_IMAGE || 'hello-world:latest' }}
  SCANNER_FAIL_ON: ${{ inputs.fail_on || vars.SCANNER_FAIL_ON || 'HIGH' }}
  SCANNER_OUTPUT_DIR: scan-results
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

jobs:
  vulnerability-gate:
    name: Vulnerability gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true

      - name: Refresh vulnerability database
        run: trivy image --download-db-only

      - name: Run deterministic tests
        run: python -m pytest -q --junitxml=test-results/junit.xml

      - name: Enforce image vulnerability policy
        id: scan
        run: |
          set +e
          python -m scanner.trivy_scanner "$SCAN_IMAGE"
          code=$?
          echo "Scanner exit code: $code"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Generate JSON, HTML, and PDF reports
        if: always()
        run: |
          shopt -s nullglob
          artifacts=(scan-results/*-????????.json)
          if [ ${#artifacts[@]} -eq 0 ]; then
            echo "No normalized scan artifacts found; report generation skipped."
            exit 0
          fi
          python -m reporters.cli "${artifacts[@]}" --formats json,html,pdf --output-dir reports

      - name: Send severity-aware Slack alert
        if: always() && github.event_name != 'pull_request' && env.SLACK_WEBHOOK_URL != ''
        run: |
          shopt -s nullglob
          reports=(reports/*.json)
          mapfile -t canonical < <(printf '%s\n' "${reports[@]}" | grep -v '\.manifest\.json$')
          if [ ${#canonical[@]} -eq 0 ]; then
            echo "No canonical report found; Slack alert skipped."
            exit 0
          fi
          python -m notifiers.cli "${canonical[0]}"

      - name: Restore vulnerability gate result
        if: always() && steps.scan.outputs.exit_code != '0' && steps.scan.outputs.exit_code != ''
        run: |
          echo "Restoring vulnerability gate exit code ${{ steps.scan.outputs.exit_code }}"
          exit "${{ steps.scan.outputs.exit_code }}"

      - name: Upload scan and test evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: vulnerability-evidence-${{ github.run_number }}
          path: |
            scan-results/*.json
            reports/*
            test-results/junit.xml
          if-no-files-found: warn
          retention-days: 30
